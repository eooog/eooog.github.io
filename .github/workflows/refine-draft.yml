name: Refine draft and open PR

on:
  push:
    branches:
      - "draft/**"
    paths:
      - "_drafts/**.md"
  workflow_dispatch: {}

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Anthropic WIF용 GitHub OIDC 토큰 발급에 필요

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      # LLM_PROVIDER가 openai가 아니면(기본값 anthropic 포함) Anthropic WIF용
      # GitHub OIDC 토큰을 받아와서 파일로 저장해둔다. anthropic.mjs가 이 파일을
      # ANTHROPIC_IDENTITY_TOKEN_FILE 경로로 읽어서 단기 액세스 토큰으로 교환한다.
      - name: Fetch GitHub OIDC token for Claude WIF
        if: ${{ vars.LLM_PROVIDER != 'openai' }}
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > /tmp/gha-jwt

      - name: Refine draft with LLM
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          # Anthropic: WIF (고정 API 키 없음)
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
          # OpenAI: 여전히 static key (WIF 미지원)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/refine-draft.mjs

      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "refine: AI가 다듬은 포스트 초안"
          title: "[자동 다듬기] ${{ env.POST_TITLE }}"
          body: |
            Claude가 다듬고 메타데이터를 생성한 포스트입니다.
            diff를 검수한 뒤 문제 없으면 merge하세요. merge되면 기존 배포 워크플로우가 그대로 퍼블리싱을 처리합니다.
          branch: auto/publish-${{ github.run_id }}
          base: main
          labels: auto-draft
          delete-branch: true
